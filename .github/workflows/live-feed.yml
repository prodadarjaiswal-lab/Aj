name: Live prices (market hours)

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # lets the job start its own successor before GitHub's 6-hour limit

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub allows 6 h per job; a second run is started at 14:45 IST to cover the close
    concurrency:
      group: live-${{ github.event.schedule || 'manual' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 pyotp==2.9.0 numpy==2.1.3
      - name: Stream prices to the live branch
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_LIVE_REPO: ${{ vars.PUBLIC_LIVE_REPO || 'prodadarjaiswal-lab/aj-live' }}
          PUBLIC_LIVE_TOKEN: ${{ secrets.PUBLIC_LIVE_TOKEN }}
        run: |
          cd scripts/dhan_refresh
          python bot.py menu || true
          now=$(TZ=Asia/Kolkata date +%H%M)
          # GitHub stops a job at 6 hours: stream for at most 5 h 40 min, then hand over to a fresh run (next step)
          UNTIL=$(python3 -c "import datetime as d;n=d.datetime.now(d.timezone(d.timedelta(hours=5,minutes=30)));e=min(n.replace(hour=15,minute=35,second=0),n+d.timedelta(hours=5,minutes=40));print(e.strftime('%H:%M'))")
          echo "streaming until $UNTIL IST"
          echo "UNTIL=$UNTIL" >> "$GITHUB_ENV"
          python live_poller.py --until $UNTIL --every 5
      - name: Hand over to a fresh run if the market is still open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M); dow=$(TZ=Asia/Kolkata date +%u)
          # only when this run stopped at its own 5 h 40 min limit (not a holiday stop or a hand-over)
          if [ "$dow" -le 5 ] && [ "$now" -lt 1525 ] && [ "${UNTIL/:/}" != "1535" ] && [ "$now" -ge "${UNTIL/:/}" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/live-feed.yml/dispatches" -f ref="${{ github.ref_name }}" && echo "started the next live run"
          else echo "market closed; no hand-over"; fi
      - name: Tell the owner if this failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/dhan_refresh/telegram.py test "⚠️ NSE live price job stopped with an error. Alerts and replies are off until it restarts." || true
