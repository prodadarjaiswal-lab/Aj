name: Quant lab (formula search)

on:
  schedule:
    - cron: "30 5 * * 6"     # Saturdays 11:00 IST, after the Saturday technical back-test
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: quant-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # No Dhan secrets: the lab works only on files already in the repo.
      - run: pip install pysr==2.7.2 numpy==2.1.3 pandas==2.2.3 scikit-learn==1.5.2
      - name: Formula search on data/formula-sample.csv (PySR, 20 minutes)
        run: |
          cd scripts/dhan_refresh
          python formula_lab.py --root ../.. --minutes 20
      - name: Risk lab (only if risklab.py exists and accepts --full)
        run: |
          cd scripts/dhan_refresh
          if [ -f risklab.py ] && python risklab.py --help 2>&1 | grep -q -- "--full"; then
            python risklab.py --full || echo "risk lab failed"
          else
            echo "risklab.py absent or has no --full; skipped"
          fi
      - name: Commit result
        run: |
          for f in docs/formula.json docs/risklab.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "dhan-refresh-bot"
          git config user.email "dhan-refresh-bot@users.noreply.github.com"
          git commit -m "Quant lab $(TZ=Asia/Kolkata date +%F)"
          git pull -q --rebase origin main
          git push
