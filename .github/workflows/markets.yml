name: Dhan extras (manual): options, auction, markets

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dhan-refresh
  cancel-in-progress: false

jobs:
  markets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 pyotp==2.9.0
      - name: Options snapshot, auction levels, commodities and news
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: cd scripts/dhan_refresh && python extras.py --root ../..
      - name: Commit
        run: |
          git add docs/markets.json docs/auction.json docs/auction-desk.md data/options
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "dhan-refresh-bot"
          git config user.email "dhan-refresh-bot@users.noreply.github.com"
          git commit -m "Dhan extras $(TZ=Asia/Kolkata date +%F)"
          git pull -q --rebase origin main
          git push
