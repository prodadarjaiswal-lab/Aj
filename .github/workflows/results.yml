name: Quarterly results (NSE XBRL)

on:
  schedule:
    - cron: "17 2 * * 3,6"     # Wednesday and Saturday 07:47 IST; incremental, so later runs are short
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: cd scripts/dhan_refresh && python results.py
      - name: Commit
        if: always()
        run: |
          git add data/results-cache.json docs/results.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "dhan-refresh-bot"
          git config user.email "dhan-refresh-bot@users.noreply.github.com"
          git commit -m "Quarterly results $(TZ=Asia/Kolkata date +%F)"
          git pull -q --rebase origin main
          git push
