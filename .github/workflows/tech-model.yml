name: Technical model back-test

on:
  schedule:
    - cron: "40 3 * * 6"     # Saturdays 09:10 IST, after the setup back-test
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dhan-refresh        # shares the Dhan login queue with the nightly refresh
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 pyotp==2.9.0
      - name: Back-test the technical signals on 6 years of Dhan data
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: |
          cd scripts/dhan_refresh
          python tech_model.py --root ../..
      - name: Commit result
        run: |
          git add docs/tech-model.json docs/tech-today.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "dhan-refresh-bot"
          git config user.email "dhan-refresh-bot@users.noreply.github.com"
          git commit -m "Technical model back-test $(TZ=Asia/Kolkata date +%F)"
          git pull -q --rebase origin main
          git push
