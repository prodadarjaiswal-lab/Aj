name: Trading Terminal back-test

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**"]
    paths: ["scripts/dhan_refresh/terminal_bt.py", ".github/workflows/terminal.yml"]

permissions:
  contents: write

concurrency:
  group: terminal-bt
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 pyotp==2.9.0 numpy==2.1.3 pytest==8.3.3
      - name: Offline tests
        run: cd scripts/dhan_refresh && python -m pytest -q tests/test_terminal_bt.py
      - name: One-month back-test at 09:30, 12:30, 15:00 and the markets board
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: cd scripts/dhan_refresh && python terminal_bt.py
      - name: Commit results
        run: |
          git add docs/terminal
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "dhan-refresh-bot"
          git config user.email "dhan-refresh-bot@users.noreply.github.com"
          git commit -m "Terminal back-test $(TZ=Asia/Kolkata date +%F)"
          git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
