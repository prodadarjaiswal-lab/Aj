name: Dhan nightly refresh

on:
  workflow_dispatch:           # "Run workflow" button for a manual run
    inputs:
      only_gold:
        description: "Only rebuild the Gold desk (skip everything else)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dhan-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 pyotp==2.9.0 numpy==2.1.3 pytest==8.3.3 arch==9.0.0 mapie==1.6.0 scikit-learn==1.9.1
      - name: Offline tests
        if: ${{ !inputs.only_gold }}
        run: python -m pytest -q scripts/dhan_refresh/tests
      - name: Pull from Dhan and update RA Desk
        if: ${{ !inputs.only_gold }}
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python scripts/dhan_refresh/refresh.py --page docs/ra-desk.html --with-options --with-n500 --with-markets --with-auction --with-tech
      - name: NSE feeds (results calendar, filings, FII/DII)
        if: ${{ !inputs.only_gold }}
        run: cd scripts/dhan_refresh && python nse_feeds.py || true
      - name: US desk data (Alpha Vantage weekly history + Dhan US closes)
        if: ${{ !inputs.only_gold }}
        run: cd scripts/dhan_refresh && python us_model.py || true
      - name: Journal review and daily Telegram digest
        if: ${{ !inputs.only_gold }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: cd scripts/dhan_refresh && python daily_digest.py --send || true
      - name: Trading Terminal back-test (09:30 / 12:30 / 15:00, last month) and markets board
        if: ${{ !inputs.only_gold }}
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: cd scripts/dhan_refresh && python terminal_bt.py || echo "::warning::Terminal back-test failed"
      - name: Gold desk (Dhan daily closes for GOLDBEES, MCX GOLD, Nifty)
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: |
          python -m pytest -q scripts/dhan_refresh/tests/test_gold_desk.py
          cd scripts/dhan_refresh && python gold_desk.py || echo "::warning::Gold desk failed"
      - name: Commit gold only
        if: ${{ inputs.only_gold }}
        run: |
          git add docs/gold docs/gold-desk.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "dhan-refresh-bot"
          git config user.email "dhan-refresh-bot@users.noreply.github.com"
          git commit -m "Gold desk $(TZ=Asia/Kolkata date +%F)"
          git push
      - name: Commit if changed
        if: ${{ !inputs.only_gold }}
        run: |
          git add -N docs/gold docs/gold-desk.html docs/terminal docs/radesk-latest.json data/options docs/n500.json docs/tech-today.json docs/tech-model.json docs/tech-model-history.json docs/technical-desk.md docs/auction.json docs/auction-desk.md docs/track-record.json docs/markets.json docs/quant.json docs/value-model.json docs/portfolio.json docs/us-desk.json docs/chart-data.json docs/research.json docs/fund500.json docs/tradeplan.json docs/risklab.json docs/formula.json data/formula-sample.csv docs/journal-review.json docs/nse-feeds.json data/us-history.json data/nifty500.csv 2>/dev/null || true
          if git diff --quiet -- docs/gold docs/gold-desk.html docs/terminal docs/ra-desk.html docs/radesk-latest.json data/options docs/n500.json docs/nse-terminal.html; then echo "no change"; exit 0; fi
          git config user.name "dhan-refresh-bot"
          git config user.email "dhan-refresh-bot@users.noreply.github.com"
          for f in docs/gold docs/gold-desk.html docs/terminal docs/ra-desk.html docs/radesk-latest.json data/options docs/n500.json docs/tech-today.json docs/tech-model.json docs/tech-model-history.json docs/technical-desk.md docs/auction.json docs/auction-desk.md docs/track-record.json docs/markets.json docs/quant.json docs/value-model.json docs/portfolio.json docs/us-desk.json docs/chart-data.json docs/research.json docs/fund500.json docs/tradeplan.json docs/risklab.json docs/formula.json data/formula-sample.csv docs/journal-review.json docs/nse-feeds.json docs/nse-terminal.html data/nifty500.csv data/us-history.json; do [ -e "$f" ] && git add "$f"; done
          git commit -m "Nightly Dhan refresh $(TZ=Asia/Kolkata date +%F)"
          git pull -q --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; git pull -q --no-rebase --autostash -X ours origin main; }
          git push
      - name: Tell the owner if this failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/dhan_refresh/telegram.py test "⚠️ Nightly Dhan refresh failed. Prices and signals may be a day old. It retries on the next run." || true
