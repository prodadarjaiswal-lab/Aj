name: Auction signals back-test

on:
  schedule:
    - cron: "10 4 * * 6"     # Saturdays 09:40 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dhan-refresh        # one Dhan login at a time
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 pyotp==2.9.0
      - name: Back-test auction signals on 12 months of Dhan 5-minute bars
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: |
          cd scripts/dhan_refresh
          python auction_bt.py --root ../..
      - name: Commit result
        run: |
          git add docs/auction-backtest.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "dhan-refresh-bot"
          git config user.email "dhan-refresh-bot@users.noreply.github.com"
          git commit -m "Auction back-test $(TZ=Asia/Kolkata date +%F)"
          git pull -q --rebase origin main
          git push
