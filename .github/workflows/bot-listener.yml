name: Telegram bot (always on)

# Not scheduled: the owner chose market-hours replies only, which the live price job handles at no extra cost.
# Run this by hand only if the bot must answer outside market hours.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-listener          # one listener at a time; at most one waiting
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 numpy==2.1.3
      - name: Answer Telegram for up to 5 h 40 m
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: cd scripts/dhan_refresh && python listener.py --minutes 340
