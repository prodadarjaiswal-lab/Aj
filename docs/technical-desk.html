<title>Technical Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single column of panels; search on top, the stock's verdict first, then its readout, auction levels and options. */
:root{--bg:#f4f6f5;--panel:#ffffff;--ink:#14201b;--mute:#5d6b64;--line:#d8dfdb;--accent:#0f6b52;--up:#1b7d4a;--down:#b8322b;--warn:#a46a00;--bar:#cfe3da;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1412;--panel:#16201c;--ink:#e3ebe7;--mute:#93a39b;--line:#28352f;--accent:#4cc79c;--up:#4cc38a;--down:#f0766d;--warn:#e0a13a;--bar:#22433a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1412;--panel:#16201c;--ink:#e3ebe7;--mute:#93a39b;--line:#28352f;--accent:#4cc79c;--up:#4cc38a;--down:#f0766d;--warn:#e0a13a;--bar:#22433a;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:600 22px/1.2 var(--sans);margin:0}h2{font:600 15px/1.3 var(--sans);margin:0}
.sub{color:var(--mute);font-size:13px}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;max-width:320px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px var(--sans);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--ink);cursor:pointer}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;border:1px solid currentColor}
.good{color:var(--up)}.bad{color:var(--down)}.warn{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kv{border:1px solid var(--line);border-radius:8px;padding:8px}
.kv .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.kv .v{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px}
td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:12px;color:var(--mute)}
.prof{display:flex;flex-direction:column;gap:1px;font:11px var(--mono)}
.prof .b{display:flex;align-items:center;gap:6px}
.prof .p{width:72px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.prof .bar{height:9px;background:var(--bar);border-radius:2px}
.prof .va .bar{background:var(--accent);opacity:.55}.prof .poc .bar{background:var(--accent);opacity:1}
svg text{fill:var(--mute);font:10px var(--mono)}
</style>
<div class="wrap">
  <div class="row" style="justify-content:space-between;align-items:end">
    <div><h1>Technical Desk</h1><p class="sub" id="asof"></p></div>
    <input id="q" placeholder="Search a stock: TCS, MCX, NIFTY" autocomplete="off" aria-label="Search a stock">
  </div>
  <div class="chips" id="quick"></div>
  <div class="pnl" id="verdict"></div>
  <div class="pnl"><h2>Indicator readout</h2><div class="grid" id="readout"></div><p class="note">Plain values. Only the signals that passed the back-test can change a verdict.</p></div>
  <div class="pnl" id="auctionP"><h2>Auction and order flow</h2><div id="auction"></div></div>
  <div class="pnl" id="optP"><h2>Options and gamma</h2><div id="opts"></div></div>
  <div class="pnl"><h2>Back-test scoreboard</h2><div class="tw"><table id="board"></table></div><p class="note" id="boardnote"></p></div>
  <div class="pnl"><h2>Auction signals back-test</h2><div class="tw"><table id="aboard"></table></div><p class="note" id="aboardnote"></p></div>
</div>
<script>
const D=/*DATA*/null/*DATA*/||{model:{signals:{},base:{out:{up:{},weak:{}}}},today:{stocks:{}},board:{rows:[]},auction:{symbols:{}},opts:{rows:{}},abt:null,regimeUp:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pc=(x,d=1)=>x==null?"–":(x>0?"+":"")+(x*100).toFixed(d)+"%";
const num=(x,d=1)=>x==null?"–":Number(x).toLocaleString("en-IN",{maximumFractionDigits:d});
const NAMES=D.model.names||{};
const flag=D.regimeUp===false?"tested_weak":"tested",side=D.regimeUp===false?"weak":"up";
const tested=Object.keys(D.model.signals||{}).filter(k=>(D.model.signals[k]||{})[flag]&&!["extended","downtrend"].includes(k))
  .sort((a,b)=>((D.model.signals[b]||{}).lift_out_x10||0)-((D.model.signals[a]||{}).lift_out_x10||0));
const bySym={};(D.board.rows||[]).forEach(r=>bySym[r.s]=r);
$("asof").textContent=`Data to ${D.today.asof||"?"} · Dhan · market ${D.regimeUp===false?"weak (Nifty below 200-day)":"rising (Nifty above 200-day)"} · re-tested nightly`;

function verdict(sym){
  const t=D.today.stocks[sym]||{},r=bySym[sym]||{},el=$("verdict");
  if(!t.c&&!r.last){el.innerHTML=`<h2>${esc(sym)}</h2><p>Not in the Nifty 500 data.</p>`;return}
  const last=t.c||r.last,a=t.atr,nw=tested.filter(k=>(t.new||[]).includes(k)),st=r.status;
  let call,cls,why="";
  if(nw.length&&!["weak","fade"].includes(st)){const s=((D.model.signals[nw[0]]||{}).out||{})[side]||{};call="Buy candidate";cls="good";
    why=`${esc(NAMES[nw[0]]||nw[0])}. Last 2 years: ${num(s.n,0)} cases, beat the Nifty ${Math.round((s.hit10||0)*100)}% of the time within 10 days, average ${pc(s.x10)} vs a typical stock's ${pc((D.model.base.out[side]||{}).x10)}.`}
  else if(nw.length){call="Wait";cls="warn";why="A tested signal fired, but the stock itself lags the Nifty 500."}
  else if(["weak","fade"].includes(st)){call="Avoid";cls="bad";why=`The stock is ${st==="weak"?"weak":"fading"} against the Nifty 500 and has no tested entry signal.`}
  else if(["lead","improve"].includes(st)){call="Wait";cls="warn";why=`A ${st==="lead"?"leading":"improving"} stock, but no tested entry signal today.`}
  else{call="No trade";cls="warn";why="Neither leading nor lagging, and no tested entry signal."}
  const lv=(call==="Buy candidate"||call==="Wait")&&a?`<p>Stop ${num(last-2*a)} (${pc(-2*a/last)}) · target ${num(last+3*a)} (${pc(3*a/last)}) · from 2 and 3 times the daily range.</p>`:"";
  const other=(t.new||[]).filter(k=>!tested.includes(k));
  el.innerHTML=`<div class="row"><h2>${esc(sym)} ₹${num(last,2)}</h2><span class="tag ${cls}">${call}</span><span class="sub">rank ${r.rank??"–"} of ${(D.board.rows||[]).length} · ${esc(st||"–")}</span></div>
    <p>${why}</p>${lv}${other.length?`<p class="note">Also fired, but failed the back-test so ignored: ${other.map(k=>esc(NAMES[k]||k)).join("; ")}.</p>`:""}`;
}
function readout(sym){
  const t=D.today.stocks[sym]||{},f=[["RSI(14)",t.rsi],["ADX(14)",t.adx==null?null:`${t.adx} ${t.di}`],["Supertrend",t.st],["MACD",t.macd],
    ["vs 50-day",t.vs50==null?null:t.vs50+"%"],["vs 200-day",t.vs200==null?null:t.vs200+"%"],["From 52w high",t.hi52==null?null:t.hi52+"%"],
    ["3m vs Nifty",t.rs3==null?null:t.rs3+"%"],["Volume vs 50d",t.volx==null?null:t.volx+"x"],["ATR",t.atr_pct==null?null:t.atr_pct+"%"],["Band width pct",t.bbw_pct]];
  $("readout").innerHTML=f.map(([k,v])=>`<div class="kv"><div class="k">${k}</div><div class="v">${esc(v??"–")}</div></div>`).join("");
}
function profile(hist,poc,val,vah){
  const ks=Object.keys(hist||{}).map(Number).sort((a,b)=>b-a);if(!ks.length)return"";
  const step=Math.max(1,Math.ceil(ks.length/40)),rows=[];
  for(let i=0;i<ks.length;i+=step){const grp=ks.slice(i,i+step),v=grp.reduce((s,k)=>s+hist[k],0);rows.push([grp[0],v])}
  const mx=Math.max(...rows.map(r=>r[1]));
  return `<div class="prof" aria-label="Volume profile">${rows.map(([p,v])=>`<div class="b ${Math.abs(p-poc)<1e-9?"poc":(p>=val&&p<=vah?"va":"")}"><span class="p">${num(p,2)}</span><span class="bar" style="width:${(v/mx*100).toFixed(1)}%"></span></div>`).join("")}</div>`;
}
function auction(sym){
  const a=(D.auction.symbols||{})[sym==="NIFTY"?"Nifty 50":sym];
  if(!a){$("auction").innerHTML=`<p class="note">No 1-minute auction data for ${esc(sym)} yet. The nightly refresh covers the Nifty 50, the indices and the stocks you ask the bot about.</p>`;return}
  const t=a.tpo||{},v=a.vp,w=a.vwap,dl=a.delta,parts=[];
  if(v)parts.push(`<p><b>Volume profile</b> <span class="note">(derived)</span>: POC ${num(v.poc,2)}, value ${num(v.val,2)} to ${num(v.vah,2)}.</p>`);
  if(w&&w.vwap)parts.push(`<p><b>VWAP</b> ${num(w.vwap,2)} (±1σ ${num(w.dn1,2)} to ${num(w.up1,2)}); price ${w.dev_sd}σ away, ${esc(w.state)} for ${w.minutes_on_side} min.</p>`);
  if(dl&&dl.cum_delta_est!=null)parts.push(`<p><b>Delta</b> <span class="note">(estimate from bar closes; Dhan has no bid/ask tape)</span>: cumulative ${num(dl.cum_delta_est,0)}, buy share ${dl.buy_share_est}${dl.divergence_est?`; ${esc(dl.divergence_est)}`:""}.</p>`);
  if(a.auction)parts.push(`<p><b>Auction</b>: opened ${esc(a.auction.open_vs_prev_value)}; ${esc(a.auction.read)}.</p>`);
  if(t.tpo_poc!=null)parts.push(`<p><b>Market profile</b> <span class="note">(exact)</span>: POC ${num(t.tpo_poc,2)}, value ${num(t.tpo_val,2)} to ${num(t.tpo_vah,2)}; Initial Balance ${num(t.ib_low,2)} to ${num(t.ib_high,2)}, extension ${esc(t.ib_extension)}; ${t.excess_high?"excess":"poor"} high, ${t.excess_low?"excess":"poor"} low${(t.single_prints||[]).length?`; single prints ${t.single_prints.map(s=>s.join("–")).join(", ")}`:""}.</p>`);
  if(a.note)parts.push(`<p class="note">${esc(a.note)}</p>`);
  $("auction").innerHTML=`<p class="sub">Session ${esc(a.date)} · context only until these signals pass the back-test</p>${parts.join("")}`;
}
function gexChart(by,spot,flip){
  const ks=Object.keys(by||{}).map(Number).sort((a,b)=>a-b);if(ks.length<3)return"";
  const W=640,H=180,pad=34,mx=Math.max(...ks.map(k=>Math.abs(by[k])))||1,x=k=>pad+(k-ks[0])/(ks[ks.length-1]-ks[0]||1)*(W-2*pad),y=v=>H/2-v/mx*(H/2-18),bw=Math.max(2,(W-2*pad)/ks.length*0.7);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gamma exposure by strike"><line x1="${pad}" x2="${W-pad}" y1="${H/2}" y2="${H/2}" stroke="var(--line)"/>`;
  ks.forEach(k=>{const v=by[k],yy=y(v);s+=`<rect x="${(x(k)-bw/2).toFixed(1)}" y="${Math.min(yy,H/2).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.abs(yy-H/2).toFixed(1)}" fill="${v>=0?"var(--up)":"var(--down)"}"/>`});
  [["spot",spot],["flip",flip]].forEach(([n,v])=>{if(v&&v>=ks[0]&&v<=ks[ks.length-1])s+=`<line x1="${x(v)}" x2="${x(v)}" y1="10" y2="${H-14}" stroke="var(--ink)" stroke-dasharray="${n==="flip"?"3 3":""}"/><text x="${x(v)+3}" y="${n==="flip"?22:12}">${n} ${num(v,0)}</text>`});
  s+=`<text x="${pad}" y="${H-2}">${num(ks[0],0)}</text><text x="${W-pad}" y="${H-2}" text-anchor="end">${num(ks[ks.length-1],0)}</text></svg>`;return s;
}
function opts(sym){
  const o=(D.opts.rows||{})[sym];
  if(!o){$("opts").innerHTML=`<p class="note">No option chain for ${esc(sym)} in the nightly snapshot.</p>`;return}
  $("opts").innerHTML=`<p>Expiry ${esc(o.expiry)}: expected move ±${(o.exp_move*100).toFixed(1)}%, put/call open interest ${o.pcr_oi?.toFixed(2)}, heaviest calls ${num(o.call_wall,0)}, puts ${num(o.put_wall,0)}.</p>`+
   (o.net_gex!=null?`<p><b>Gamma</b> <span class="note">(derived, assumes dealers long calls and short puts)</span>: ${esc(o.gex_regime)}. Gamma flip ${num(o.gamma_flip,0)}; call gamma at ${(o.call_gamma_strikes||[]).join(", ")}; put gamma at ${(o.put_gamma_strikes||[]).join(", ")}.</p>${gexChart(o.gex_by_strike,o.spot,o.gamma_flip)}`:`<p class="note">Gamma exposure appears after the next nightly refresh.</p>`);
}
function board(){
  const rows=Object.entries(D.model.signals||{}).map(([k,s])=>{const u=(s.out||{}).up||{},w=(s.out||{}).weak||{};return [k,s,u,w]}).sort((a,b)=>((b[1].lift_out_x10||0)-(a[1].lift_out_x10||0)));
  $("board").innerHTML=`<tr><th>Signal</th><th>Rising</th><th>Weak</th><th class="n">Cases</th><th class="n">Beat Nifty</th><th class="n">vs typical, 10d</th></tr>`+rows.map(([k,s,u])=>
   `<tr><td>${esc(NAMES[k]||k)}</td><td>${s.tested?'<span class="good">passed</span>':'<span class="note">failed</span>'}</td><td>${s.tested_weak?'<span class="good">passed</span>':'<span class="note">failed</span>'}</td><td class="n">${num(u.n,0)}</td><td class="n">${u.hit10==null?"–":Math.round(u.hit10*100)+"%"}</td><td class="n">${pc(s.lift_out_x10,2)}</td></tr>`).join("");
  $("boardnote").textContent=`Out-of-sample from ${D.model.cutoff||"?"} on ${D.model.stocks||"?"} stocks. Passed = beat the average stock in both periods with t ≥ 2 and 100+ cases.`;
  const ab=D.abt;
  if(!ab){$("aboard").innerHTML="";$("aboardnote").textContent="The first auction back-test result appears here once it finishes.";return}
  $("aboard").innerHTML=`<tr><th>Auction signal</th><th>Result</th><th class="n">Cases</th><th class="n">Hit</th><th class="n">Net per trade</th></tr>`+Object.values(ab.signals).map(s=>
   `<tr><td>${esc(s.name)}</td><td>${s.tested?'<span class="good">passed</span>':'<span class="note">failed</span>'}</td><td class="n">${num((s.out||{}).n,0)}</td><td class="n">${(s.out||{}).hit==null?"–":Math.round(s.out.hit*100)+"%"}</td><td class="n">${pc((s.out||{}).net,2)}</td></tr>`).join("");
  $("aboardnote").textContent=`Same-day trade to the close vs the Nifty, net of 0.06% costs, second half of ${ab.from} to ${ab.asof}, ${ab.stocks} Nifty 50 stocks.`;
}
function show(sym){sym=(sym||"").toUpperCase().trim();if(!sym)return;verdict(sym);readout(sym);auction(sym);opts(sym==="NIFTY 50"?"NIFTY":sym);
  try{localStorage.setItem("td-last",sym)}catch(e){}}
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")show(e.target.value)});
const picks=Object.entries(D.today.stocks||{}).filter(([s,t])=>tested.some(k=>(t.new||[]).includes(k))&&["lead","improve"].includes((bySym[s]||{}).status)).map(([s])=>s).slice(0,8);
$("quick").innerHTML=["NIFTY",...picks].map(s=>`<button class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join("");
$("quick").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(b){$("q").value=b.dataset.s;show(b.dataset.s)}});
board();let first="TCS";try{first=localStorage.getItem("td-last")||"TCS"}catch(e){}$("q").value=first;show(first);
</script>
