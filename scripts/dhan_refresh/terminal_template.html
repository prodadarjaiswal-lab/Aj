<title>Aj Trading Terminal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a trading-desk console. Status bar, market tape, then the proof (back-test) before any list of names. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --ink:#17202a; --mute:#5d6873; --line:#d9ddd6;
  --amber:#b86e00; --up:#0b7a5a; --down:#c2412d; --chip:#eceee8;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --panel:#151d26; --ink:#e4e8ec; --mute:#8b97a3; --line:#25313d;
  --amber:#f0a83a; --up:#3fcf9b; --down:#ff7a62; --chip:#1d2833; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --panel:#151d26; --ink:#e4e8ec; --mute:#8b97a3; --line:#25313d;
  --amber:#f0a83a; --up:#3fcf9b; --down:#ff7a62; --chip:#1d2833; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:28px;font-weight:700}
h2{font-size:19px;font-weight:600}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.mute{color:var(--mute)}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font:12px var(--f-mono);color:var(--mute);border-block:1px solid var(--line);padding-block:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mute)}
.dot.ok{background:var(--up)} .dot.warn{background:var(--amber)}
.up{color:var(--up)} .down{color:var(--down)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.grid3{grid-template-columns:1fr}}
.mk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.ck{display:flex;flex-direction:column;gap:10px}
.ck .big{font:600 30px var(--f-mono);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px}
.kv dt{color:var(--mute)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono)}
.pill{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.05em;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--mute);text-transform:uppercase}
.pill.pass{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.pill.fail{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:500 12px var(--f-mono);background:transparent;color:var(--mute);border:0;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cell{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.cell small{color:var(--mute);font-size:11px}
td.hit{box-shadow:inset 3px 0 0 var(--up)}
.lnk{font:600 13px var(--f-body);color:var(--amber);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.note{font-size:13px;color:var(--mute);max-width:75ch}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline}
svg text{fill:var(--mute);font:10px var(--f-mono)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.stile{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;font-family:var(--f-mono)}
.stile .sk{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stile b{font-size:17px;font-variant-numeric:tabular-nums}.stile span.up,.stile span.down{font-size:12px}
.stile:hover{border-color:var(--amber)}
td[id*="lc-"].up{background:color-mix(in srgb,var(--up) 16%,transparent)}td[id*="lc-"].down{background:color-mix(in srgb,var(--down) 16%,transparent)}
.panel h2,.panel h3{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.1em;font-size:13px;border-left:3px solid var(--amber);padding-left:8px}
</style>

<div class="wrap">
  <header class="head">
    <div>
      <div class="eyebrow">NSE · MCX · Research software, not advice</div>
      <h1>Aj Trading Terminal</h1>
    </div>
    <div class="seg" role="group" aria-label="Theme"><button id="th-auto" aria-pressed="true">Auto</button><button id="th-light" aria-pressed="false">Light</button><button id="th-dark" aria-pressed="false">Dark</button></div>
  </header>
  <div class="bar" id="status"></div>

  <div class="strip" id="strip"></div>
  <section class="panel">
    <div class="head"><h2>Markets</h2><span class="mute mono" id="mk-asof"></span></div>
    <div class="mk" id="mk" style="margin-top:12px"></div>
  </section>

  <section class="panel" id="sum" style="display:flex;flex-direction:column;gap:16px"></section>
</div>

<script>
const BT=/*BT*/null, MK=/*MK*/null, WL=/*WL*/null, WK=/*WK*/null, META=/*META*/null;
window.TMK=MK;window.TWK=WK;
const $=id=>document.getElementById(id);
const pct=(x,d=2)=>x==null?"–":(x>0?"+":"")+x.toFixed(d)+"%";
const cls=x=>x==null?"":x>0?"up":x<0?"down":"";
const inr=x=>x==null?"–":(x<0?"−":"")+"₹"+Math.abs(Math.round(x)).toLocaleString("en-IN");
const fmt=x=>x==null?"–":x.toLocaleString("en-IN",{maximumFractionDigits:x>=1000?0:2});

/* theme toggle */
(function(){const set=t=>{if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);
  ["auto","light","dark"].forEach(k=>$("th-"+k).setAttribute("aria-pressed",String(k===t)));try{localStorage.setItem("th",t)}catch(e){}};
  ["auto","light","dark"].forEach(k=>$("th-"+k).onclick=()=>set(k));let t="auto";try{t=localStorage.getItem("th")||"auto"}catch(e){}set(t)})();

function spark(a,w=110,h=28){if(!a||a.length<2)return"";const lo=Math.min(...a),hi=Math.max(...a),r=hi-lo||1;
  const p=a.map((v,i)=>[(i/(a.length-1))*(w-4)+2,h-3-((v-lo)/r)*(h-6)]);const up=a[a.length-1]>=a[0];
  const col=up?"var(--up)":"var(--down)";const d="M"+p.map(q=>q[0].toFixed(1)+" "+q[1].toFixed(1)).join("L");
  const e=p[p.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}L${e[0].toFixed(1)} ${h}L2 ${h}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"/><circle cx="${e[0]}" cy="${e[1]}" r="2.2" fill="${col}"/></svg>`}

function status(){const s=[];
  s.push(`<span><span class="dot ${MK?"ok":"warn"}"></span>Markets ${MK?MK.asof+" IST":"missing"}</span>`);

  s.push(`<span id="livenote"><span class="dot warn"></span>Live: connecting…</span>`);
  s.push(`<span>Page built ${META.built} IST</span>`);
  $("status").innerHTML=s.join("")}

const STRIP=["Nifty 50","Nifty Bank","India VIX","Nifty Midcap 100","Nifty IT","GOLD","SILVER","CRUDEOIL","NIFTYBEES","GOLDBEES"];
function strip(){if(!MK)return;const all={};Object.values(MK.groups).forEach(rows=>rows.forEach(r=>all[r.k]=r));
  $("strip").innerHTML=STRIP.filter(k=>all[k]).map(k=>{const r=all[k],c=r.chg*100;return`<button class="stile" data-mk="${r.k}"><span class="sk">${r.name.replace(/ \(.*$/,"")}</span>
   <b id="sv-${r.seg}-${r.sid}">${fmt(r.last)}</b><span class="${cls(c)}" id="sc-${r.seg}-${r.sid}">${c>0?"▲":c<0?"▼":""} ${pct(c)}</span>${spark((r.hist&&r.hist.c||r.spark).slice(-20),150,22)}</button>`}).join("")}
function markets(){if(!MK){$("mk").innerHTML='<p class="mute">No markets file yet.</p>';return}
  $("mk-asof").textContent="closes as of "+MK.asof+" IST";
  $("mk").innerHTML=Object.entries(MK.groups).map(([g,rows])=>`<div class="scroll"><h3 style="font-size:15px;margin-bottom:6px">${g}</h3><table>
   <tr><th>Name</th><th class="n">Last</th><th class="n">Day</th><th class="n">1M</th><th>60D</th></tr>
   ${rows.map(r=>`<tr title="${r.contract||""}" class="go" data-mk="${r.k}"><td><button class="lnk" data-mk="${r.k}">${r.name}</button>${r.expiry?` <small class="mute">${r.expiry.slice(5)}</small>`:""}</td><td class="n" id="lv-${r.seg}-${r.sid}">${fmt(r.last)}</td>
   <td class="n ${cls(r.chg)}" id="lc-${r.seg}-${r.sid}">${pct(r.chg*100)}</td><td class="n ${cls(r.r21)}">${r.r21==null?"–":pct(r.r21*100,1)}</td><td>${spark(r.spark,90,24)}</td></tr>`).join("")}
   </table></div>`).join("")+(MK.missing&&MK.missing.length?`<p class="mute" style="grid-column:1/-1;font-size:12px">Not returned by Dhan: ${MK.missing.join("; ")}</p>`:"")}

status();strip();markets();
document.addEventListener("click",e=>{const b=e.target.closest("[data-mk]");if(b&&window.azGo)azGo(b.dataset.mk)});
/* Live prices: GitHub Actions streams Dhan prices every 5 s to the public repo prodadarjaiswal-lab/aj-live during
   market hours (one Dhan login a day). The page reads live.json through the GitHub connector. */
const LV={ok:false,at:0,t:null,busy:false};
const istNow=()=>new Date(Date.now()+5.5*3600e3);
const mktOpen=()=>{const d=istNow(),w=d.getUTCDay(),m=d.getUTCHours()*60+d.getUTCMinutes();return w>0&&w<6&&m>=540&&m<=1415};
function liveText(r){for(const b of (r&&r.content)||[]){const x=b&&b.resource;if(x&&typeof x.text==="string")return x.text;
  if(b&&b.type==="text"&&typeof b.text==="string"){const i=b.text.indexOf('{"t"');if(i>=0)return b.text.slice(i)}}return null}
function liveNote(h,ok){const el=$("livenote");if(el)el.innerHTML=`<span class="dot ${ok?"ok":"warn"}"></span>${h}`}
async function livePoll(mcp){if(LV.busy)return;LV.busy=true;
  try{const r=await mcp.callTool("GitHub","get_file_contents",{owner:"prodadarjaiswal-lab",repo:"aj-live",path:"live.json"},{cache:false});
    const t=liveText(r);if(!t)throw{code:"empty"};const d=JSON.parse(t);if(!d.q||!d.t)throw{code:"empty"};
    const fresh=String(d.t).slice(0,10)===istNow().toISOString().slice(0,10);let n=0;
    /* a live.json newer than the data baked into this page (a missed republish): its last prices are the latest close */
    const newer=!fresh&&MK&&String(d.t).slice(0,10)>String(MK.asof||"").slice(0,10),use=fresh||newer;
    if(use&&MK)for(const rows of Object.values(MK.groups))for(const r of rows){const a=((d.q[r.seg]||{})[String(r.sid)]);
      if(a&&a[0]){const base=r.d===String(d.t).slice(0,10)?r.prev:newer?(a[4]||r.last):(r.last||a[4]),el=$(`lv-${r.seg}-${r.sid}`),ec=$(`lc-${r.seg}-${r.sid}`);if(el)el.textContent=fmt(a[0]);
        if(ec&&base){const c=(a[0]/base-1)*100;ec.textContent=pct(c);ec.className="n "+cls(c)}
        const sv=$(`sv-${r.seg}-${r.sid}`),sc=$(`sc-${r.seg}-${r.sid}`);if(sv)sv.textContent=fmt(a[0]);if(sc&&base){const c=(a[0]/base-1)*100;sc.textContent=(c>0?"▲ ":c<0?"▼ ":"")+pct(c);sc.className=cls(c)}n++}}
    window.TLIVE=use?d.q:null;window.TLIVE_T=d.t;try{document.dispatchEvent(new Event("tlive"))}catch(e){}
    LV.ok=true;LV.at=Date.now();LV.t=d.t;
    const dm=new Date(String(d.t).slice(0,10)+"T00:00:00Z").toLocaleDateString("en-GB",{day:"2-digit",month:"short",timeZone:"UTC"});
    liveNote(fresh?`<b>LIVE</b> ${String(d.t).slice(11,19)} IST · ${n} board prices`:newer?`Close ${dm} · from the live feed`:`Market closed · last live ${String(d.t).slice(0,16)} IST`,fresh||newer)}
  catch(e){const c=e&&e.code;const why=c==="server_not_connected"?"add the GitHub connector in Claude settings":c==="needs_reauth"?"reconnect GitHub in Claude settings":c==="not_granted"||c==="consent_required"?"allow GitHub for this page":"feed not running, retrying";
    if(!LV.ok||Date.now()-LV.at>120000)liveNote(`Live off (${why}) · showing closing prices`,false)}
  finally{LV.busy=false}}
(async()=>{let mcp=null;try{mcp=window.claude&&window.claude.use?await window.claude.use("mcp"):null}catch(e){mcp=null}
  if(!mcp){liveNote("Live off (open this page on claude.ai) · showing closing prices",false);return}
  const loop=async()=>{if(!document.hidden)await livePoll(mcp);setTimeout(loop,mktOpen()?5000:60000)};loop()})();
</script>
